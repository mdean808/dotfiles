set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:usstyle:clipboard"
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind C-l send-keys C-l

bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e2030,fg=#c8d3f5"
set -g message-style "bg=#2f334d,fg=#82aaff"
set -g mode-style "bg=#2f334d"
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

set -g @program-icon "#{?#{==:#{pane_current_command},ssh},\U000f048b,#{?#{m:*vim,#{pane_current_command}},,#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},,#{?#{==:#{pane_current_command},node},,#{?#{m:python*,#{pane_current_command}},,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},,#{?#{==:#{pane_current_command},docker},,#{?#{==:#{pane_current_command},claude},\U000f06a9,#{?#{m/r:^(h|b)?top$,#{pane_current_command}},,}}}}}}}}}"

set -g status-left-length 80
set -g status-left "#[fg=#{?client_prefix,#ff966c,#82aaff},bg=#1e2030]#[fg=#1e2030,bg=#{?client_prefix,#ff966c,#82aaff},bold]\U000f018d #S#[fg=#{?client_prefix,#ff966c,#82aaff},bg=#1e2030,nobold] #[fg=#2f334d,bg=#1e2030]#[fg=#82aaff,bg=#2f334d] #{=/-40/…:#{s|^/home/[^/]+|~|:pane_current_path}}#[fg=#2f334d,bg=#1e2030] "

setw -g window-status-separator ""
setw -g window-status-format ""
setw -g window-status-current-format ""

set -g status-right-length 150
set -g status-right "#(~/.config/tmux/scripts/git-status.sh '#{pane_current_path}')#[fg=#2f334d,bg=#1e2030]#[fg=#c3e88d,bg=#2f334d]#{E:@program-icon} #{pane_current_command}#{?window_zoomed_flag, \U000f0293,}#[fg=#2f334d,bg=#1e2030] #[fg=#2f334d,bg=#1e2030]#[fg=#ffc777,bg=#2f334d] %a %-d %b  \U000f0954 %H:%M#[fg=#2f334d,bg=#1e2030]"
